<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diviya Dharshini S – Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>


 <section id="contact">
    <div class="container contact-container">
      <div class="section-header reveal">
        <p class="section-label">// Ping Me</p>
        <h2 class="section-title">Let's Connect</h2>
        <p class="contact-sub"> Drop me a message!</p>
      </div>

      <form id="contactForm" class="contact-form reveal"
        action="https://formspree.io/f/mlgavopz" method="POST">

        <div class="form-row">
          <div class="form-group">
            <label for="name">NAME</label>
            <input type="text" id="name" name="name" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="subject">SUBJECT</label>
          <input type="text" id="subject" name="subject" placeholder="What's this about?" />
        </div>

        <div class="form-group">
          <label for="message">MESSAGE</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">
          <span id="btnText">Send Message</span>
          <span id="btnIcon">✦</span>
        </button>
        <div id="form-status"></div>
      </form>

      <div class="social-links reveal">
        <a href="https://www.linkedin.com/in/diviyadharshini7706/" target="_blank" class="social-btn">🔗 LinkedIn</a>
        <a href="mailto:diviyadharshinisasikumar@gmail.com" class="social-btn">✉ Email</a>
      </div>
    </div>
  </section>

  <footer>
    <p>Crafted by <span class="footer-name">Diviya Dharshini S  {Still Under Construction}</span> &middot; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
