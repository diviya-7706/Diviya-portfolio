<div class="theme-switcher" id="themeSwitcher">
    <button class="theme-toggle-btn" id="themeToggleBtn" title="Change theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
    <div class="theme-panel" id="themePanel">
      <p class="theme-label">THEME</p>
      <div class="theme-options">
        <button class="t-opt active" data-theme="rose"   title="Rose Gold">
          <span class="t-swatch" style="background:linear-gradient(135deg,#c0706a,#d4a96a)"></span>
          <span>Rose Gold</span>
        </button>
        <button class="t-opt" data-theme="ocean"  title="Ocean Blue">
          <span class="t-swatch" style="background:linear-gradient(135deg,#0070f3,#00d4ff)"></span>
          <span>Ocean</span>
        </button>
        <button class="t-opt" data-theme="purple" title="Purple">
          <span class="t-swatch" style="background:linear-gradient(135deg,#7c3aed,#c4b5fd)"></span>
          <span>Purple</span>
        </button>
        <button class="t-opt" data-theme="emerald" title="Emerald">
          <span class="t-swatch" style="background:linear-gradient(135deg,#059669,#34d399)"></span>
          <span>Emerald</span>
        </button>
      </div>
    </div>
  </div>
